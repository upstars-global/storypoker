name: Claude review

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  pull_request:
    types: [ready_for_review, review_requested]

concurrency:
  group: >-
    claude-review-${{ github.event.pull_request.head.ref || github.event.workflow_run.head_branch }}${{
    github.event.action == 'review_requested' && github.event.requested_reviewer.login != 'so-upstars'
    && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  gate:
    name: Review gate
    if: >-
      (github.event_name == 'pull_request' &&
        (github.event.action == 'ready_for_review' || github.event.requested_reviewer.login == 'so-upstars')) ||
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: write
    outputs:
      review: ${{ steps.gate.outputs.review }}
      number: ${{ steps.gate.outputs.number }}
      base_sha: ${{ steps.gate.outputs.base_sha }}
      head_sha: ${{ steps.gate.outputs.head_sha }}
    steps:
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          RUN_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          RUN_PRS: ${{ toJSON(github.event.workflow_run.pull_requests) }}
          MARKER: '<!-- claude-review -->'
          CONTEXT: Claude review
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          post_status() {
            gh api "repos/$REPO/statuses/$head_sha" -f state="$1" -f description="$2" \
              -f context="$CONTEXT" -f target_url="$RUN_URL" > /dev/null
          }

          skip() {
            echo "Skip: $1"
            echo "review=false" >> "$GITHUB_OUTPUT"
            exit 0
          }

          if [ "$EVENT" = pull_request ]; then
            number="$EVENT_PR"
          else
            [ "$RUN_HEAD_REPO" = "$REPO" ] || skip "fork PR"
            number=$(jq -r '.[0].number // empty' <<< "$RUN_PRS")
          fi
          [ -n "$number" ] || skip "no pull request for this run"

          pr=$(gh api "repos/$REPO/pulls/$number")
          [ "$(jq -r .state <<< "$pr")" = open ] || skip "PR #$number is not open"
          [ "$(jq -r .draft <<< "$pr")" = false ] || skip "PR #$number is a draft"
          [ "$(jq -r .head.repo.full_name <<< "$pr")" = "$REPO" ] || skip "PR #$number is from a fork"
          [ "$(jq -r .user.type <<< "$pr")" != Bot ] || skip "PR #$number is from a bot"
          head_sha=$(jq -r .head.sha <<< "$pr")
          base_sha=$(jq -r .base.sha <<< "$pr")
          requested=$(jq '[.requested_reviewers[].login] | index("so-upstars") != null' <<< "$pr")

          ci=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$head_sha&event=pull_request&per_page=1" \
            --jq '.workflow_runs[0].conclusion // "none"')
          if [ "$ci" != success ]; then
            if [ "$requested" = true ] && [ "$ci" = none ]; then
              post_status pending "Review requested; waiting for green CI"
            elif [ "$requested" = true ]; then
              post_status error "Review requested; CI is $ci, the review waits for a green run"
            fi
            skip "CI on $head_sha is $ci"
          fi

          bodies=""
          if [ "$requested" != true ]; then
            bodies=$(gh api --paginate "repos/$REPO/pulls/$number/reviews" \
              --jq '.[] | select(.user.login == "so-upstars") | .body'
            gh api --paginate "repos/$REPO/issues/$number/comments" \
              --jq '.[] | select(.user.login == "so-upstars") | .body')
          fi
          if grep -qF "$MARKER" <<< "$bodies"; then
            post_status success "Skipped: the PR already has a Claude review"
            skip "PR #$number already has a Claude review"
          fi

          post_status pending "Claude review in progress"

          {
            echo "review=true"
            echo "number=$number"
            echo "base_sha=$base_sha"
            echo "head_sha=$head_sha"
          } >> "$GITHUB_OUTPUT"

  review:
    name: Claude review
    needs: gate
    if: needs.gate.outputs.review == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      statuses: write
      id-token: write
    env:
      GH_TOKEN: ${{ secrets.SO_UPSTARS_PR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.head_sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install cr-request skill
        run: |
          npx -y --prefer-online skl-x@0.4.12 add sentimony/agentic-workflow -s cr-request -a claude-code -y -m sm
          test -f .claude/skills/cr-request/SKILL.md

      - name: Check reviewer identity
        run: |
          test -n "$GH_TOKEN" || { echo "::error::SO_UPSTARS_PR_TOKEN is not set"; exit 1; }
          login="$(gh api user --jq .login)"
          test "$login" = so-upstars || { echo "::error::SO_UPSTARS_PR_TOKEN belongs to '$login', not so-upstars"; exit 1; }

      - name: Record review start
        id: start
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.SO_UPSTARS_PR_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ needs.gate.outputs.number }}
            BASE SHA: ${{ needs.gate.outputs.base_sha }}
            HEAD SHA: ${{ needs.gate.outputs.head_sha }}

            Run the cr-request skill for this pull request. The review boundary is the committed range
            BASE SHA...HEAD SHA (three dots, from their merge base); both commits are available locally.
            Read the PR title and description with `gh pr view` for requirements. CI is green on HEAD SHA.
            Do not run gh-switch or cr-received and do not modify repository files.

            If the cr-request skill is not available to you, do not review and do not post anything; stop and
            report that the skill is missing.

            Post exactly one pull request review in English with
            `gh pr review ${{ needs.gate.outputs.number }} --comment --body-file /tmp/claude-review.md`, after writing
            the body to that file; never approve or request changes. The body must start with the line
            `<!-- claude-review -->`, then the reviewed range, the commits in it, and the coverage (files read, what
            was skipped), then a `### Summary` section with two Markdown tables and one line.

            Write the reviewed range as a compare link with short SHAs, followed by the number of files and lines:
            [`<base7>...<head7>`](https://github.com/${{ github.repository }}/compare/<BASE SHA>...<HEAD SHA>)
            List the commits from `git log --format='%h %H %s' BASE SHA..HEAD SHA`, one line each, as
            - [`<short sha>`](https://github.com/${{ github.repository }}/commit/<full sha>) <subject>
            After 20 commits write `and <n> more`.

            The Summary section:

            | Axis | Verdict |
            | --- | --- |
            | Intent | PASS, FINDINGS, or UNASSESSED |
            | System | PASS, FINDINGS, or UNASSESSED |
            | Craft | PASS, FINDINGS, or UNASSESSED |

            | Severity | Count |
            | --- | --- |
            | Critical | <n> |
            | Important | <n> |
            | Minor | <n> |

            **Merge readiness:** ready, ready with fixes, or not ready - <one line>

            Use only the severities Critical, Important, and Minor; the counts must match the findings, and zero
            findings means zeros. After the summary: the findings with severity, location, impact, evidence, and
            confidence, the set-aside list, open questions about intent, and strengths.
            The body must end with the line `Reviewed with: cr-request skill`.
          claude_args: >-
            --allowedTools "Skill,Agent,Task,Read,Grep,Glob,Write,Bash(git branch:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git status:*),Bash(git rev-parse:*),Bash(git merge-base:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr review ${{ needs.gate.outputs.number }} --comment --body-file /tmp/claude-review.md)"

      - name: Verify review
        id: verify
        env:
          REPO: ${{ github.repository }}
          NUMBER: ${{ needs.gate.outputs.number }}
          HEAD_SHA: ${{ needs.gate.outputs.head_sha }}
          STARTED_AT: ${{ steps.start.outputs.at }}
        run: |
          reviews=$(gh api --paginate "repos/$REPO/pulls/$NUMBER/reviews" \
            --jq '.[] | select(.user.login == "so-upstars" and .commit_id == env.HEAD_SHA
              and .submitted_at >= env.STARTED_AT) | .body')
          grep -qF 'Reviewed with: cr-request skill' <<< "$reviews" \
            || { echo "No review on $HEAD_SHA since $STARTED_AT made with the cr-request skill"; exit 1; }

      - name: Report review status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ needs.gate.outputs.number }}
          HEAD_SHA: ${{ needs.gate.outputs.head_sha }}
          VERIFY: ${{ steps.verify.outcome }}
          STARTED_AT: ${{ steps.start.outputs.at }}
          JOB_STATUS: ${{ job.status }}
          MARKER: '<!-- claude-review -->'
          CONTEXT: Claude review
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          post_status() {
            gh api "repos/$REPO/statuses/$HEAD_SHA" -f state="$1" -f description="$2" \
              -f context="$CONTEXT" -f target_url="$RUN_URL" > /dev/null
          }
          count() {
            grep -oE "^\| *$1 *\| *[0-9]+ *\|" <<< "$body" | grep -oE '[0-9]+' | head -n 1 || true
          }

          if [ "$JOB_STATUS" = cancelled ]; then
            latest=$(gh api "repos/$REPO/commits/$HEAD_SHA/statuses" \
              --jq '[.[] | select(.context == env.CONTEXT)][0].target_url // ""')
            [ "$latest" != "$RUN_URL" ] || post_status error "Claude review was cancelled"
            exit 0
          fi
          [ "$VERIFY" = success ] || { post_status failure "Claude review failed before posting a review"; exit 0; }

          body=$(gh api --paginate --slurp "repos/$REPO/pulls/$NUMBER/reviews" \
            | jq -r --arg marker "$MARKER" --arg sha "$HEAD_SHA" --arg since "$STARTED_AT" \
              '[.[][] | select(.user.login == "so-upstars" and .commit_id == $sha and .submitted_at >= $since
                and (.body | contains($marker)))] | last | .body // ""')
          critical=$(count Critical)
          important=$(count Important)
          minor=$(count Minor)
          readiness=$(grep -oE '\*\*Merge readiness:\*\* *(ready with fixes|not ready|ready)' <<< "$body" \
            | sed -E 's/.*\*\* *//' | head -n 1 || true)

          if [ -z "$critical" ] || [ -z "$important" ] || [ -z "$minor" ] || [ -z "$readiness" ]; then
            post_status failure "The review has no Summary counts or merge readiness"
            exit 0
          fi

          summary="Critical $critical, Important $important, Minor $minor; $readiness"
          if [ "$critical" -gt 0 ] || [ "$readiness" = "not ready" ]; then
            post_status failure "$summary"
          else
            post_status success "$summary"
          fi
