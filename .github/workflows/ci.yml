name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-secrets:
    name: Detect secrets
    runs-on: ubuntu-latest
    outputs:
      has_e2e: ${{ steps.check.outputs.has_e2e }}
    steps:
      - id: check
        env:
          E2E_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_ANON: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          E2E_SR: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
          E2E_USER: ${{ secrets.E2E_TEST_USER_EMAIL }}
          E2E_PASS: ${{ secrets.E2E_TEST_USER_PASSWORD }}
        run: |
          if [[ -n "$E2E_URL" && -n "$E2E_ANON" && -n "$E2E_SR" && -n "$E2E_USER" && -n "$E2E_PASS" ]]; then
            echo "has_e2e=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_e2e=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check skills.sh syntax
        run: sh -n scripts/skills.sh

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install probe skills
        run: |
          npx -y --prefer-online skl-x@0.4.12 add sentimony/skills -s cross-review -a codex claude-code -y -m sm
          npx -y --prefer-online skl-x@0.4.12 add sentimony/agentic-workflow -s cr-request cr-received session-learnings -a codex claude-code -y -m sm

      - name: Check probe skills
        run: |
          for skill in cross-review cr-request cr-received session-learnings; do
            for dir in .claude/skills .agents/skills; do
              if [ ! -f "$dir/$skill/SKILL.md" ]; then
                echo "$dir/$skill/SKILL.md is missing"
                exit 1
              fi
            done
          done

      - name: Remove probe skills
        run: npx -y --prefer-online skl-x@0.4.12 rm cross-review cr-request cr-received session-learnings -y -m sm

      # -L catches a dangling symlink that -e misses
      - name: Check probe skills removal
        run: |
          for skill in cross-review cr-request cr-received session-learnings; do
            for dir in .claude/skills .agents/skills; do
              if [ -e "$dir/$skill" ] || [ -L "$dir/$skill" ]; then
                echo "$dir/$skill still exists"
                exit 1
              fi
            done
          done

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run icons:check
      - run: pnpm run typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:unit:coverage
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-unit
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Placeholders keep the Supabase client in the graph so the icon budget measures a
      # production-shaped bundle; see docs/audits/README.md. This dist is for auditing only -
      # production is built by Netlify from the repo, not shipped from here.
      - run: pnpm run build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_KEY: placeholder
      - name: Audit the icon delivery graph
        run: pnpm run icons:audit-build
      - name: Upload icon audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: icon-bundle-audit
          path: test-results/icon-rendering/
          retention-days: 7

  # Playwright's webServer builds the app before it previews, so this job also verifies
  # that the production bundle boots with dummy Supabase credentials.
  page-load:
    name: Public pages load
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Playwright system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - run: pnpm exec playwright test --project page-load --project icon-delivery
        env:
          VITE_SUPABASE_URL: https://dummy.supabase.co
          VITE_SUPABASE_KEY: sb_publishable_dummy_key_for_page_load_smoke_only
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-page-load
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: E2E
    needs: detect-secrets
    if: ${{ needs.detect-secrets.outputs.has_e2e == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-webkit-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Install Playwright system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium webkit
      - run: pnpm run test:e2e
        env:
          VITE_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          SUPABASE_TEST_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
          E2E_TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
          E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-e2e
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
