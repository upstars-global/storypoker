name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check skills.sh syntax
        run: sh -n scripts/skills.sh

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install probe skills
        run: |
          npx -y --prefer-online skl-x@0.4.12 add sentimony/skills -s scope-triage scope-check plan-crafting inline-plan-dev subagent-plan-dev git-worktree-isolation parallel-agents tdd review-request cross-review review-resolution debugging web-debug webapp-debugger verification-gate branch-finish commit-all gh-switch frontend-crafting vitest typescript echarts prose-crafting dashfix negafix maintaining-agent-context secret-hygiene skill-crafting -a codex claude-code -y -m sm
          npx -y --prefer-online skl-x@0.4.12 add sentimony/agentic-workflow -s specify plan-craft implement verify cr-request cr-received finalize session-learnings -a codex claude-code -y -m sm

      - name: Check probe skills
        run: |
          for skill in scope-triage scope-check plan-crafting inline-plan-dev subagent-plan-dev git-worktree-isolation parallel-agents tdd review-request cross-review review-resolution debugging web-debug webapp-debugger verification-gate branch-finish commit-all gh-switch frontend-crafting vitest typescript echarts prose-crafting dashfix negafix maintaining-agent-context secret-hygiene skill-crafting specify plan-craft implement verify cr-request cr-received finalize session-learnings; do
            for dir in .claude/skills .agents/skills; do
              if [ ! -f "$dir/$skill/SKILL.md" ]; then
                echo "$dir/$skill/SKILL.md is missing"
                exit 1
              fi
            done
          done

      - name: Remove probe skills
        run: npx -y --prefer-online skl-x@0.4.12 rm scope-triage scope-check plan-crafting inline-plan-dev subagent-plan-dev git-worktree-isolation parallel-agents tdd review-request cross-review review-resolution debugging web-debug webapp-debugger verification-gate branch-finish commit-all gh-switch frontend-crafting vitest typescript echarts prose-crafting dashfix negafix maintaining-agent-context secret-hygiene skill-crafting specify plan-craft implement verify cr-request cr-received finalize session-learnings -y -m sm

      # -L catches a dangling symlink that -e misses
      - name: Check probe skills removal
        run: |
          for skill in scope-triage scope-check plan-crafting inline-plan-dev subagent-plan-dev git-worktree-isolation parallel-agents tdd review-request cross-review review-resolution debugging web-debug webapp-debugger verification-gate branch-finish commit-all gh-switch frontend-crafting vitest typescript echarts prose-crafting dashfix negafix maintaining-agent-context secret-hygiene skill-crafting specify plan-craft implement verify cr-request cr-received finalize session-learnings; do
            for dir in .claude/skills .agents/skills; do
              if [ -e "$dir/$skill" ] || [ -L "$dir/$skill" ]; then
                echo "$dir/$skill still exists"
                exit 1
              fi
            done
          done

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # TypeScript 7 runs a native tsc from an optional platform package; an install
      # that drops optional dependencies leaves typecheck and the icon scanner without it.
      - name: Check native TypeScript 7 binary
        run: pnpm exec tsc -v | grep 'Version 7\.'
      - run: pnpm run icons:check
      - run: pnpm run typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:unit:coverage
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-unit
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Placeholders keep the Supabase client in the graph so the icon budget measures a
      # production-shaped bundle; see docs/audits/README.md. This dist is for auditing only -
      # production is built by Netlify from the repo, not shipped from here.
      - run: pnpm run build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_KEY: placeholder
      - name: Audit the icon delivery graph
        run: pnpm run icons:audit-build
      - name: Upload icon audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: icon-bundle-audit
          path: test-results/icon-rendering/
          retention-days: 7

  # Playwright's webServer builds the app before it previews, so this job also verifies
  # that the production bundle boots with dummy Supabase credentials.
  page-load:
    name: Public pages load
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Playwright system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - run: pnpm exec playwright test --project page-load --project icon-delivery
        env:
          VITE_SUPABASE_URL: https://dummy.supabase.co
          VITE_SUPABASE_KEY: sb_publishable_dummy_key_for_page_load_smoke_only
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-page-load
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Renders the base revision and this one in the same pinned Playwright image (tag = @playwright/test)
  # and compares them; no baseline PNGs are stored. Not a required check. git must be in the image,
  # otherwise checkout falls back to the REST API and leaves no history for git archive.
  # Owner decision 2026-10-26: off on push and pull requests while it is unstable (about 6 minutes);
  # run it with a manual dispatch.
  visual:
    name: Visual
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user root
    env:
      HOME: /root
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends git
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The container runs as root, so git refuses the runner-owned checkout without this.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # A push that creates a branch reports an all-zero before SHA, which git archive cannot read.
      # A dispatch has neither SHA, so it compares with the merge-base, not the newer main tip.
      - run: pnpm run test:visual "${BASE_REF:-$(git merge-base origin/main HEAD)}"
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || '' }}
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-visual
          path: |
            test-results/playwright/
            test-results/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  # Runs against a throwaway local Supabase on the runner (Docker is preinstalled), never the
  # shared project. scripts/supabase-local.sh writes .env/.env.test, which playwright.config.ts
  # skips under CI, so the next step exports it to the job env.
  # Owner decision 2026-10-26: off on push and pull requests while image pulls hit registry rate
  # limits; run it with a manual dispatch.
  e2e:
    name: E2E
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-webkit-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Install Playwright system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium webkit
      - uses: supabase/setup-cli@v1
        with:
          version: 2.108.0
      - run: pnpm run supabase:local
      - name: Export local Supabase env
        run: |
          while IFS='=' read -r key value; do
            case "$key" in
              SUPABASE_TEST_SERVICE_ROLE_KEY|E2E_TEST_USER_PASSWORD) echo "::add-mask::$value" ;;
            esac
            echo "$key=$value" >> "$GITHUB_ENV"
          done < .env/.env.test
      - run: pnpm run test:e2e
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-e2e
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
